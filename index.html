<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quick Quiz</title><link rel="stylesheet" href="style.css"><script src="script.js" defer></script></head>
<body><main class="quiz"><p class="eyebrow">TEST YOUR KNOWLEDGE</p><h1>Quick Quiz</h1><div class="progress-row"><span id="progress">Question 1 of 5</span><span id="score">Score: 0</span></div><div class="track"><div id="progress-bar"></div></div><section id="quiz-area"><h2 id="question"></h2><div id="answers" class="answers"></div><p id="feedback" aria-live="polite"></p><button id="next" disabled>Next question</button></section><section id="result" hidden><h2>Quiz completed!</h2><p id="final-score"></p><button id="restart">Try again</button></section></main></body></html>
